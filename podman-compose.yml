# ============================================================
# HRMS Portal — Podman Compose
# Usage: podman-compose up -d
#
# Services:
#   postgres       → localhost:5432  (PostgreSQL 16)
#   redis          → localhost:6379  (Redis 7)
#   elasticsearch  → localhost:9200  (Elasticsearch 8)
#   minio          → localhost:9000  (S3 API) / localhost:9001 (Console)
#   mailpit        → localhost:1025  (SMTP) / localhost:8025 (Web UI)
# ============================================================

name: hrms-portal

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL 16 — Primary database
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hrms_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_password}
      POSTGRES_DB: ${POSTGRES_DB:-hrms_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms} -d ${POSTGRES_DB:-hrms_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────────────────
  # Redis 7 — Cache + BullMQ queue broker + rate limiting
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hrms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # Elasticsearch 8 — Full-text search (used from Phase 2+)
  # NOTE: Requires vm.max_map_count=262144 on the host.
  # On Windows + Podman Machine (WSL2), run once:
  #   podman machine ssh "sysctl -w vm.max_map_count=262144"
  # ──────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: hrms_elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - cluster.name=hrms-cluster
      - node.name=hrms-es-01
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=false
      - "network.host=0.0.0.0"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ──────────────────────────────────────────────────────────
  # MinIO — S3-compatible local file storage
  # Web Console: http://localhost:9001
  # Default credentials: see .env (MINIO_ROOT_USER/PASSWORD)
  # ──────────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: hrms_minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hrms_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hrms_minio_password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # MinIO initialization — creates the default bucket after MinIO starts
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: hrms_minio_init
    restart: no
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hrms_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hrms_minio_password}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hrms-dev}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$MINIO_BUCKET_NAME &&
        mc anonymous set none local/$$MINIO_BUCKET_NAME &&
        echo '✅ MinIO bucket ready:' $$MINIO_BUCKET_NAME
      "

  # ──────────────────────────────────────────────────────────
  # Mailpit — Local email catcher (no emails sent to real addresses)
  # SMTP:   localhost:1025
  # Web UI: http://localhost:8025
  # ──────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: hrms_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# ──────────────────────────────────────────────────────────────
# Named Volumes — data persists across container restarts
# To wipe all data: podman-compose down -v
# ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  minio_data:
    driver: local

# ──────────────────────────────────────────────────────────────
# Network — all services on the same internal network
# ──────────────────────────────────────────────────────────────
networks:
  default:
    name: hrms_network
    driver: bridge
