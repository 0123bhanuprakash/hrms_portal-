# ============================================================
# Redis configuration for local development
# ============================================================

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence — save every 20 changes or every 60 seconds
save 60 1
save 20 10

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel warning
logfile ""

# Performance
tcp-keepalive 300
timeout 0

# Databases — we use separate Redis DB indexes:
#   0 → Default / General cache
#   1 → BullMQ job queues
#   2 → Session store / refresh tokens
#   3 → Rate limiting
databases 16
